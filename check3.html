    <!-- Internal Styles for Subject Links and Container -->
    <style>
        body {
            font-family: 'Arial', sans-serif;
        }

        .navbar {
            background-color: #6F2DA8;
        }

        .navbar-brand h2 {
            color: #6F2DA8;
            margin-left: 15px;
            font-weight: bold;
        }

        .subjects {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 100px;
        }

        .subjects li {
            list-style: none;
            flex: 1 1 30%;
            max-width: 250px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            background-color: #f0f0f0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .subjects li:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .subjects a {
            text-decoration: none;
            color: #333;
            display: block;
        }
       
        .subjects .topic1, .subjects .topic2, .subjects .topic3 {
            font-size: 22px;
            font-weight: bold;
            color: #6F2DA8;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            align-items:line;
        }

        .subjects li:hover .topic1, 
        .subjects li:hover .topic2, 
        .subjects li:hover .topic3 {
            background-color: #6F2DA8;
            color: white;
        }

        .container {
            padding: 40px;
            background-color: #f9f9f9;
            border-radius: 0px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 80px;
        }

        .container h2 {
            text-align: center;
            font-size: 35px;
            color: #6F2DA8;
            margin-bottom: 30px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .subjects {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>

</head>
