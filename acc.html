<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Created</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
        }

        .coming-soon-container {
            max-width: 600px;
            padding: 2rem;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            color: #010d06;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 2rem;
        }

        .notify-btn {
            font-size: 1rem;
            padding: 0.8rem 1.5rem;
            color: white;
            background-color:  #bcaec3;;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .notify-btn:hover {
            background-color: #c9c8d1;;
        }
    </style>
</head>
<body>

    <div class="coming-soon-container">
        <h1>Your accout has been Created</h1>
        <p> "You're officially part of the learning journey! Let's dive in and explore."
        </p>
        <button class="notify-btn"> <a href="learnistry.html">back  to Learning</button></a>
    </div>

</body>
</html>
