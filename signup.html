
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign UP</title>
    <link rel="stylesheet"href="signup.css">
 </head>
<body>
    <div class="signup-container">
       
                <h1>Signup</h1>
               <form>
                <div class="input-container">
                    <label for="first-name">
                        
                        <input class="text" id="first-name" name="first name" placeholder="First name" required>
                    </label>
                </div>
                <div class="input-container">
                    <label for="last-name">
                        
                        <input class="text" id="last-name" name="Last name" placeholder="Last name" required>
                    </label>
                </div>
                <div class="input-container">
                    <label for="email">
                        
                        <input class="text" id="email" name="email" placeholder="Email" required>
                    </label>
                </div>
                <div class="input-container">
                    <label for="password">
                       
                        <input class="text" id="password" name="password" placeholder="Password" required>
                    </label>
                </div>
                <div class="input-container">
                    <label for="confirm password">
                        
                        <input class="text" id="confirm password" name="confirm password" placeholder="Confirm Password" required>
                    </label>
                </div>
                <div class="submit-btn">
                    <input type="Submit" value="Create Account">
                </div>
                <p>Already Have An Account? <a href="login1.html">Login</a></p>
               </form>
            </div>
</body>
</html>
